apiVersion: v1
kind: Service
metadata:
  name: my-db
spec:
  selector:
    app.kubernetes.io/app: mysql
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3306
---
#
apiVersion: v1
kind: Service
metadata:
  name: my-app
spec:
  type: NodePort
  selector:
    app.kubernetes.io/app: employees
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30000