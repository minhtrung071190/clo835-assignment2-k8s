# mysql pod
apiVersion: v1
kind: Pod
metadata:
  name: my-db
spec:
  containers:
  - name: mysql
    image: 063388721629.dkr.ecr.us-east-1.amazonaws.com/clo835-assignment2:my-db
    ports:
    - containerPort: 3306
    env:
      - name: MYSQL_ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: db-password
            key: MYSQL_ROOT_PASSWORD
  imagePullSecrets:
  - name: ecr-secret
